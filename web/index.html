<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AI Interview</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside>
        <div class="brand">
          <span>AI</span>
          <div><b>Interview</b><small>智能面试工作台</small></div>
        </div>
        <label for="candidateName">候选人姓名</label
        ><input
          id="candidateName"
          maxlength="40"
          placeholder="请输入姓名"
        /><label for="questionCount">题目数量</label
        ><select id="questionCount">
          <option>3</option>
          <option>5</option>
          <option>10</option>
        </select>
        <div class="resume-upload">
          <label for="resumeFile">简历（可选）</label>
          <input
            id="resumeFile"
            type="file"
            accept=".pdf,application/pdf"
            aria-describedby="resumeStatus"
          />
          <div class="resume-info">
            <small id="resumeStatus" role="status">可选 PDF，最大 5 MiB</small
            ><button id="clearResume" type="button" disabled>移除</button>
          </div>
        </div>
        <button class="new" id="newSession">＋ 新建会话</button>
        <button class="account-button" id="accountButton">登录 / 注册</button>
        <div class="history">
          <b>最近面试</b>
          <div id="reportHistory" class="history-items">
            <small>登录后查看历史报告</small>
          </div>
        </div>
        <nav>
          <button id="currentInterview" class="active" type="button">
            当前面试
          </button>
          <button id="report" disabled>查看本次报告</button>
        </nav>
        <div class="side-note">
          <b>媒体能力</b>
          <p>文本 / 语音<br />回答实时输出</p>
        </div>
      </aside>
      <div id="authOverlay" class="auth-overlay" hidden>
        <form id="authForm" class="auth-card">
          <button
            id="closeAuth"
            class="auth-close"
            type="button"
            aria-label="关闭"
          >
            ×
          </button>
          <h2>欢迎回来</h2>
          <p id="authHint">登录后同步保存你的面试记录。</p>
          <label
            >邮箱<input
              id="authEmail"
              type="email"
              required
              maxlength="254"
              autocomplete="email"
          /></label>
          <label
            >昵称<input
              id="authName"
              maxlength="80"
              autocomplete="nickname"
              placeholder="仅注册时填写"
              hidden
          /></label>
          <label
            >密码<input
              id="authPassword"
              type="password"
              required
              minlength="10"
              maxlength="128"
              autocomplete="current-password"
          /></label>
          <div id="authError" role="alert"></div>
          <button id="authSubmit" class="new">登录</button>
          <button id="authToggle" class="auth-toggle" type="button">
            创建新账号
          </button>
        </form>
      </div>
      <main>
        <header>
          <div>
            <small class="eyebrow">LIVE INTERVIEW</small>
            <h1 id="sessionTitle">准备开始面试</h1>
          </div>
          <div class="connection">
            <i></i><span id="connectionText">等待连接</span>
          </div>
        </header>
        <p id="activity" role="status"></p>
        <section class="workspace">
          <div class="chat panel">
            <div class="panel-head">
              <b>面试对话</b><span id="progress">尚未开始</span>
            </div>
            <div id="messages" class="messages">
              <div class="empty">
                <strong>欢迎使用 AI Interview</strong>
                <p>填写姓名与题量，开始 C++ 后端技术面试。</p>
              </div>
            </div>
            <form id="textForm" class="composer">
              <textarea
                id="textInput"
                aria-label="面试回答"
                placeholder="输入回答；Enter 发送，Shift+Enter 换行"
              ></textarea>
              <button>发送</button>
            </form>
          </div>
          <div class="media panel">
            <div class="panel-head">
              <b>实时交互</b
              ><select id="mode">
                <option value="text">文本对话</option>
                <option value="audio">语音对话</option>
              </select>
            </div>
            <div class="media-actions">
              <button id="mic" aria-pressed="false">开始说话</button>
              <button id="stopSpeak" class="secondary">停止朗读</button>
            </div>
            <p id="mediaStatus" class="media-status" role="status">
              语音转写后可编辑确认，再提交回答。
            </p>
            <label
              ><input
                type="checkbox"
                id="autoSpeak"
                checked
              />语音模式下朗读面试官问题</label
            >
            <div class="protocol">
              <b>连接协议</b>
              <p>
                浏览器通过 gRPC-Web 直接调用后端；语音转写后提交。<br />评分和总结由服务端实时返回。
              </p>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
